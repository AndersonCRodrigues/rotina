name: Testes

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Configurar ambiente de teste (SQLite, sem Postgres no CI)
        run: |
          echo "DEBUG=True" >> .env
          echo "SECRET_KEY=ci-secret-key" >> .env
          echo "ALLOWED_HOSTS=localhost,127.0.0.1,testserver" >> .env
          echo "USE_SQLITE_FOR_TESTS=True" >> .env
          python -c "from cryptography.fernet import Fernet; print('FIELD_ENCRYPTION_KEY=' + Fernet.generate_key().decode())" >> .env

      - name: django check
        run: python manage.py check

      - name: Testes com cobertura
        run: |
          coverage run manage.py test
          coverage report -m --fail-under=100
